<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220" fill="none">
  <defs>
    <!-- Balloon Drop Shadow -->
    <filter id="balloonShadow" x="-20%" y="-10%" width="150%" height="150%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#4A90B8" flood-opacity="0.25"/>
    </filter>
    
    <!-- Shading Gradients -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8B2"/>
      <stop offset="100%" stop-color="#F27282"/>
    </linearGradient>
    <linearGradient id="coralDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF939F"/>
      <stop offset="100%" stop-color="#E25C6E"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF2E8"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B282"/>
      <stop offset="100%" stop-color="#B87E4E"/>
    </linearGradient>
  </defs>

  <g filter="url(#balloonShadow)">
    <!-- Base Balloon Shape Clip -->
    <clipPath id="envelopeClip">
      <path d="M 80 10 C 125 10 148 48 140 85 C 133 118 102 142 94 154 C 91 158 87 160 83 160 L 77 160 C 73 160 69 158 66 154 C 58 142 27 118 20 85 C 12 48 35 10 80 10 Z"/>
    </clipPath>

    <!-- Balloon Main Outer -->
    <g clip-path="url(#envelopeClip)">
      <!-- Background Coral Fill -->
      <path d="M 80 10 C 125 10 148 48 140 85 C 133 118 102 142 94 154 C 91 158 87 160 83 160 L 77 160 C 73 160 69 158 66 154 C 58 142 27 118 20 85 C 12 48 35 10 80 10 Z" fill="url(#coralGrad)"/>
      
      <!-- Left Outer Stripe (Cream) -->
      <path d="M 50 10 C 28 35 22 80 42 156 L 20 156 C 10 110 18 50 50 10 Z" fill="url(#creamGrad)"/>
      
      <!-- Left Inner Stripe (Cream) -->
      <path d="M 68 10 C 52 42 50 115 68 160 L 52 160 C 36 115 36 42 52 10 Z" fill="url(#creamGrad)"/>

      <!-- Center Stripe (Cream) -->
      <path d="M 80 10 C 74 45 74 125 80 160 L 80 10 Z" stroke="url(#creamGrad)" stroke-width="12" stroke-linecap="round"/>
      
      <!-- Right Inner Stripe (Cream) -->
      <path d="M 92 10 C 108 42 110 115 92 160 L 108 160 C 124 115 124 42 108 10 Z" fill="url(#creamGrad)"/>

      <!-- Right Outer Stripe (Cream) -->
      <path d="M 110 10 C 132 35 138 80 118 156 L 140 156 C 150 110 142 50 110 10 Z" fill="url(#creamGrad)"/>

      <!-- Delicate Shading Overlay for 3D sphere depth -->
      <radialGradient id="sphereLight" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
        <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="100%" stop-color="#7A2232" stop-opacity="0.3"/>
      </radialGradient>
      <rect x="10" y="10" width="140" height="150" fill="url(#sphereLight)"/>
    </g>

    <!-- Scalloped Collar Rim -->
    <path d="M 64 158 Q 80 164 96 158 Q 80 168 64 158 Z" fill="#FFA8B2"/>
    <rect x="68" y="160" width="24" height="4" rx="2" fill="#FFFFFF"/>

    <!-- Suspension Ropes -->
    <path d="M 70 164 L 73 186" stroke="#9E6E45" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 75 164 L 75 186" stroke="#9E6E45" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 85 164 L 85 186" stroke="#9E6E45" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 90 164 L 87 186" stroke="#9E6E45" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Cute Woven Basket -->
    <rect x="71" y="186" width="18" height="14" rx="3" fill="url(#basketGrad)"/>
    <!-- Basket Weave Lines -->
    <line x1="71" y1="190" x2="89" y2="190" stroke="#8C582B" stroke-width="0.8" opacity="0.6"/>
    <line x1="71" y1="194" x2="89" y2="194" stroke="#8C582B" stroke-width="0.8" opacity="0.6"/>
    <line x1="71" y1="198" x2="89" y2="198" stroke="#8C582B" stroke-width="0.8" opacity="0.6"/>
    <line x1="76" y1="186" x2="76" y2="200" stroke="#8C582B" stroke-width="0.8" opacity="0.6"/>
    <line x1="80" y1="186" x2="80" y2="200" stroke="#8C582B" stroke-width="0.8" opacity="0.6"/>
    <line x1="84" y1="186" x2="84" y2="200" stroke="#8C582B" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
