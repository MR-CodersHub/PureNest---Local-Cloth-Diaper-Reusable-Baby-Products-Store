<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Master Brand Gradients for Favicon -->
    <linearGradient id="favNest" x1="12%" y1="100%" x2="88%" y2="0%">
      <stop offset="0%" stop-color="#1B659B"/>
      <stop offset="50%" stop-color="#358ACD"/>
      <stop offset="100%" stop-color="#58A6DF"/>
    </linearGradient>

    <linearGradient id="favLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D925A"/>
      <stop offset="55%" stop-color="#48B478"/>
